server:
  port: 8080

spring:
  application:
    name: easyStudy-backend

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  servlet:
    multipart:
      ***REMOVED*** 单文件 20MB；请求上限留出 multipart 边界与其它字段的余量，
      ***REMOVED*** 否则恰好 20MB 的文件会因整体请求超限而失败。
      ***REMOVED*** 三层必须对齐: nginx client_max_body_size=21m / 此处 / MaterialService.MAX_FILE_SIZE
      max-file-size: 20MB
      max-request-size: 21MB

  jackson:
    property-naming-strategy: SNAKE_CASE  ***REMOVED*** 统一 snake_case，匹配接口契约文档

  ***REMOVED*** 注意: property-naming-strategy 只影响 JSON 序列化，
  ***REMOVED*** 不影响 @RequestParam 绑定 —— 后者依赖 -parameters 保留的 Java 参数名。
  ***REMOVED*** 因此查询参数要么写 snake_case 名字，要么与 Java 参数名一致（见各 Controller）。

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  expiration: ${JWT_EXPIRATION:86400}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}

fastapi:
  url: ${FASTAPI_URL:http://localhost:8000}

logging:
  level:
    com.easystudy: INFO
