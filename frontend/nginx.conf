# ═══════════════════════════════════════════════════
# easyStudy — 前端 Nginx 配置
# SPA fallback + API 反向代理到 Spring Boot
#
# 注意: nginx 的 add_header 在子 location 中会覆盖父级而非继承，
# 所以每个自带 add_header 的 location 都必须重新 include
# conf.d/security-headers.conf（见下方各 location）。
# ═══════════════════════════════════════════════════

server {
    # 非 root 运行（镜像内 UID 101）无法绑定 80，因此监听 8080；
    # 宿主机映射为 80:8080（见 docker-compose.yml）。
    listen 8080;
    server_name _;

    # 静态资源根目录
    root /usr/share/nginx/html;
    index index.html;

    # 默认安全头（被下方自带 add_header 的 location 覆盖时需重新 include）
    include /etc/nginx/conf.d/security-headers.conf;

    # 前端静态文件（SPA fallback）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，保证发版后用户立即拿到新的资源引用
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 带内容哈希的构建产物可长期缓存（附带安全头，避免被父级覆盖丢失）
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # API 反代到 Spring Boot (Docker DNS 动态解析)
    location /api/ {
        include /etc/nginx/conf.d/security-headers.conf;

        resolver 127.0.0.11 valid=10s;
        set $backend "springboot:8080";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 上传上限：必须 ≥ 应用侧配置，否则 nginx 会先返回自己的 HTML 413，
        # 前端 JSON 解析失败且用户看不到真实原因。
        # 应用侧: max-file-size=20MB / max-request-size=21MB
        client_max_body_size 21m;

        # SSE 支持（AI 对话流式输出）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
    }

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
