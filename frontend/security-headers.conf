***REMOVED*** ═══════════════════════════════════════════════════
***REMOVED*** easyStudy — 安全响应头片段
***REMOVED***
***REMOVED*** 为什么单独成文件：nginx 的 add_header 在子 location 中会 **覆盖** 父级
***REMOVED*** 而不是继承。任何自带 add_header 的 location 都必须重新 include 本文件，
***REMOVED*** 否则该路径会静默丢失全部安全头。
***REMOVED*** ═══════════════════════════════════════════════════

***REMOVED*** 说明: CSP 里保留 'unsafe-inline' 是当前技术栈的必须项 ——
***REMOVED*** React 内联样式、mermaid 生成的 SVG 内联样式都依赖它。
***REMOVED*** 因此 CSP 在本项目里是纵深防御，不是 XSS 的主防线；
***REMOVED*** 主防线是前端对 markdown 的 sanitize（见 rehype-sanitize）。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
